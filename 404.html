<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cxt — profile</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#070708;color:#fff;font-family:'Inter',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;}
  body.has-bg{background-size:cover;background-position:center;background-attachment:fixed;}
  #cx-page{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;}
  #cx-page::-webkit-scrollbar{width:0;}
  #cx-stage{position:relative;}
  #cx-stage .cx-canvas,#cx-stage .cx-glow,#cx-stage .cx-grain{position:fixed;}

  #not-found{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.1rem;z-index:60;background:#070708;}
  #not-found h1{font-size:4.5rem;font-weight:900;opacity:.15;letter-spacing:-.04em;}
  #not-found p{color:rgba(255,255,255,.45);font-size:.88rem;}
  #not-found a{color:#000;font-size:.82rem;background:#fff;border:none;padding:.5rem 1.1rem;border-radius:10px;text-decoration:none;font-weight:600;}
  #not-found a:hover{opacity:.9;}
</style>
</head>
<body>
<div id="cx-page">
  <div id="cx-stage"></div>
</div>

<div id="not-found" style="display:none;">
  <h1>404</h1>
  <p>This profile doesn't exist.</p>
  <a href="/">← Claim yours</a>
</div>

<audio id="cx-audio" crossorigin="anonymous" loop></audio>

<script src="profile.js"></script>
<script>
const SUPA_URL='https://rpgtoebzburfzgjoavoj.supabase.co';
const SUPA_KEY='sb_publishable__gbq2uFnqfe2aNaqP71smA_4e94Q5a6';

let username='';
if(location.protocol==='file:'){
  document.getElementById('not-found').style.display='flex';
  document.querySelector('#not-found p').textContent='Open via local server or deploy to GitHub Pages (file:// blocks network requests)';
} else {
  const path=location.pathname.replace(/\/$/,'').split('/').pop().replace(/\.html$/i,'');
  const known=['index','dashboard','profile','404','supabase_setup'];
  username=(path&&!known.includes(path))?path:'';
}

function show404(){
  document.getElementById('not-found').style.display='flex';
}

function render(data){
  const stage=document.getElementById('cx-stage');
  const cfg=mergeCfg(data.widget_order);
  document.title=`${data.display_name||data.username} — cxt`;
  renderCard(stage,data,cfg);
  if(data.background_url)document.body.classList.add('has-bg');
  if(data.background_url)document.body.style.backgroundImage=`url("${data.background_url}")`;
  else if(cfg.bg_color)document.body.style.background=cfg.bg_color;
  setupEffects(stage,data,cfg);
  stage.querySelector('.cx-prev-card').classList.add('animate-in');
  if(data.audio_url)initAudio(data);
}

async function load(){
  if(location.protocol==='file:')return;
  if(!username){show404();return;}
  try{
    const r=await fetch(`${SUPA_URL}/rest/v1/profiles?username=eq.${encodeURIComponent(username)}&select=*`,{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Accept':'application/json'}});
    if(!r.ok)throw new Error('Server returned '+r.status);
    const data=await r.json();
    if(!Array.isArray(data)||!data.length){show404();return;}
    render(data[0]);
    fetch(`${SUPA_URL}/rest/v1/rpc/increment_profile_views`,{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({profile_username:username})}).catch(()=>{});
  }catch(e){
    show404();
    document.querySelector('#not-found p').textContent='Error loading profile. '+(e.message||'');
  }
}
load();
</script>
</body>
</html>
