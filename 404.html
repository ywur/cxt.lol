<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cxt — profile</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:#070708;color:#fff;font-family:'Inter',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;}
  body.has-bg{background-size:cover;background-position:center;background-attachment:fixed;}
  #cx-page{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;}
  #cx-page::-webkit-scrollbar{width:0;}
  #cx-stage{position:relative;}
  #cx-stage .cx-canvas,#cx-stage .cx-glow,#cx-stage .cx-grain{position:fixed;}

  #not-found{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.1rem;z-index:60;background:#070708;}
  #not-found h1{font-size:4.5rem;font-weight:900;opacity:.15;letter-spacing:-.04em;}
  #not-found p{color:rgba(255,255,255,.45);font-size:.88rem;}
  #not-found a{color:#000;font-size:.82rem;background:#fff;border:none;padding:.5rem 1.1rem;border-radius:10px;text-decoration:none;font-weight:600;}
  #not-found a:hover{opacity:.9;}

  #cx-enter{position:fixed;inset:0;z-index:55;display:none;align-items:center;justify-content:center;background:rgba(5,5,7,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);opacity:1;transition:opacity .6s ease;cursor:pointer;}
  #cx-enter.hide{opacity:0;pointer-events:none;}
  #cx-enter .enter-inner{display:flex;flex-direction:column;align-items:center;gap:1.15rem;text-align:center;padding:2rem;max-width:90vw;}
  #cx-enter .enter-avatar{width:96px;height:96px;border-radius:50%;overflow:hidden;flex-shrink:0;border:3px solid rgba(255,255,255,.22);box-shadow:0 14px 40px rgba(0,0,0,.55);animation:enterFloat 3s ease-in-out infinite;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:2.4rem;font-weight:800;color:#fff;text-transform:uppercase;}
  #cx-enter .enter-avatar img{width:100%;height:100%;object-fit:cover;}
  #cx-enter .enter-name{font-size:1.2rem;font-weight:700;letter-spacing:-.01em;}
  #cx-enter .enter-btn{background:#fff;color:#000;border:none;border-radius:99px;padding:.75rem 2.1rem;font-family:inherit;font-size:.88rem;font-weight:700;cursor:pointer;transition:transform .2s,opacity .2s;animation:enterPulse 2.4s ease-in-out infinite;}
  #cx-enter .enter-btn:hover{transform:scale(1.05);opacity:.9;}
  #cx-enter .enter-sub{font-size:.72rem;color:rgba(255,255,255,.42);letter-spacing:.02em;}
  @keyframes enterFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes enterPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}50%{box-shadow:0 0 0 14px rgba(255,255,255,0)}}
</style>
</head>
<body>
<div id="cx-page">
  <div id="cx-stage"></div>
</div>

<div id="not-found" style="display:none;">
  <h1>404</h1>
  <p>This profile doesn't exist.</p>
  <a href="/">← Claim yours</a>
</div>

<div id="cx-enter">
  <div class="enter-inner">
    <div class="enter-avatar" id="enter-avatar"></div>
    <div class="enter-name" id="enter-name"></div>
    <button class="enter-btn" id="enter-btn">click to enter</button>
    <div class="enter-sub">your music starts when you enter</div>
  </div>
</div>

<audio id="cx-audio" crossorigin="anonymous" loop></audio>

<script src="profile.js"></script>
<script>
const SUPA_URL='https://rpgtoebzburfzgjoavoj.supabase.co';
const SUPA_KEY='sb_publishable__gbq2uFnqfe2aNaqP71smA_4e94Q5a6';

let username='';
if(location.protocol==='file:'){
  document.getElementById('not-found').style.display='flex';
  document.querySelector('#not-found p').textContent='Open via local server or deploy to GitHub Pages (file:// blocks network requests)';
} else {
  const path=location.pathname.replace(/\/$/,'').split('/').pop().replace(/\.html$/i,'');
  const known=['index','dashboard','profile','404','supabase_setup'];
  username=(path&&!known.includes(path))?path:'';
}

function show404(){
  document.getElementById('not-found').style.display='flex';
}

function render(data){
  const stage=document.getElementById('cx-stage');
  const cfg=mergeCfg(data.widget_order);
  document.title=`${data.display_name||data.username} — cxt`;
  renderCard(stage,data,cfg);
  if(data.background_url)document.body.classList.add('has-bg');
  if(data.background_url)document.body.style.backgroundImage=`url("${data.background_url}")`;
  else if(cfg.bg_color)document.body.style.background=cfg.bg_color;
  setupEffects(stage,data,cfg);
  stage.querySelector('.cx-prev-card').classList.add('animate-in');
  if(data.audio_url)initAudio(data);
  setupEnterGate(data,cfg);
}

function setupEnterGate(data,cfg){
  const gate=document.getElementById('cx-enter');
  if(!gate||!cfg.enter_gate)return;
  const av=document.getElementById('enter-avatar');
  if(data.avatar_url)av.innerHTML='<img src="'+data.avatar_url+'" alt="">';
  else av.textContent=(data.display_name||data.username||'?').charAt(0);
  document.getElementById('enter-name').textContent=data.display_name||data.username||'';
  document.getElementById('enter-btn').textContent=cfg.enter_label||'click to enter';
  gate.style.display='flex';
  gate.addEventListener('click',()=>{
    gate.classList.add('hide');
    cxStartMusic();
    setTimeout(()=>{gate.style.display='none';},650);
  });
}

async function load(){
  if(location.protocol==='file:')return;
  if(!username){show404();return;}
  try{
    const r=await fetch(`${SUPA_URL}/rest/v1/profiles?username=eq.${encodeURIComponent(username)}&select=*`,{headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Accept':'application/json'}});
    if(!r.ok)throw new Error('Server returned '+r.status);
    const data=await r.json();
    if(!Array.isArray(data)||!data.length){show404();return;}
    render(data[0]);
    fetch(`${SUPA_URL}/rest/v1/rpc/increment_profile_views`,{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json'},body:JSON.stringify({profile_username:username})}).catch(()=>{});
  }catch(e){
    show404();
    document.querySelector('#not-found p').textContent='Error loading profile. '+(e.message||'');
  }
}
load();
</script>
</body>
</html>
